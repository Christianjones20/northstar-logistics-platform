services:
  
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: northstar_user
      POSTGRES_PASSWORD: northstar_password
      POSTGRES_DB: northstar_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./application/backend

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://northstar_user:northstar_password@db:5432/northstar_db

    depends_on:
      - db

  frontend:
    build:
      context: ./application/frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000

    depends_on:
      - backend

volumes:
  postgres_data:
