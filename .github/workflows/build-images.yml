name: Build Push and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: northstarlogisticsdevacr
  ACR_LOGIN_SERVER: northstarlogisticsdevacr.azurecr.io
  RESOURCE_GROUP: rg-northstar-dev
  AKS_CLUSTER: aks-northstar-dev
  NAMESPACE: northstar

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build backend image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/northstar-backend:${{ github.sha }} \
            application/backend

      - name: Build frontend image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/northstar-frontend:${{ github.sha }} \
            application/frontend

      - name: Push backend image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/northstar-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/northstar-frontend:${{ github.sha }}

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/northstar-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/northstar-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Deploy backend
        run: |
          kubectl set image deployment/northstar-backend \
            backend=$ACR_LOGIN_SERVER/northstar-backend:${{ github.sha }} \
            -n "$NAMESPACE"

      - name: Deploy frontend
        run: |
          kubectl set image deployment/northstar-frontend \
            frontend=$ACR_LOGIN_SERVER/northstar-frontend:${{ github.sha }} \
            -n "$NAMESPACE"

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/northstar-backend \
            -n "$NAMESPACE" \
            --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/northstar-frontend \
            -n "$NAMESPACE" \
            --timeout=180s

      - name: Backend health check
        run: |
          curl --fail \
            https://northstar.172.168.110.106.nip.io/health

      - name: Frontend health check
        run: |
          curl --fail --head \
            https://northstar.172.168.110.106.nip.io